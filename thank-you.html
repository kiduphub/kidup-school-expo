<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Registration Confirmed | KidUp Hub School Expo</title>
  <style>
    :root { --navy:#172344; --yellow:#ffc42c; --muted:#64718a; }
    *,*::before,*::after { box-sizing:border-box; }
    html,body { min-height:100%; }
    body { margin:0; background:#fff; color:var(--navy); font-family:Arial,Helvetica,sans-serif; }
    .confirmation { width:min(92%,740px); min-height:100svh; margin:0 auto; padding:64px 12px 85px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
    .brand { width:min(235px,58vw); height:auto; display:block; object-fit:contain; mix-blend-mode:multiply; margin:0 auto 39px; }
    h1 { font-size:clamp(30px,5vw,53px); line-height:1.15; margin:0 0 24px; font-weight:800; letter-spacing:-1.2px; }
    .intro { max-width:660px; font-size:clamp(16px,2.1vw,21px); line-height:1.6; margin:0 auto 24px; }
    .details { font-size:clamp(14px,1.9vw,18px); line-height:1.6; font-weight:600; margin:0 auto 40px; }
    .back-button, .back-button:link, .back-button:visited { background:var(--yellow); color:var(--navy); border:0; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; text-align:center; min-height:56px; padding:17px 34px; font-size:17px; font-weight:800; text-decoration:none; width:auto; max-width:100%; transition:background .18s,transform .18s; }
    .back-button:hover { background:#ffcf53; transform:translateY(-1px); }
    .back-button:focus-visible { outline:3px solid var(--navy); outline-offset:4px; }
    @media(max-width:500px){ .confirmation{padding:45px 8px 64px;}.brand{margin-bottom:28px}.intro{margin-bottom:18px}.details{margin-bottom:30px}.back-button{width:100%;max-width:290px;} }
  </style>
</head>
<body>
  <main class="confirmation">
    <img class="brand" src="assets/kidup-logo-reference.jpg" alt="KidUp Hub logo">
    <h1>Thank you for registering!</h1>
    <p class="intro">Your registration has been received. We look forward to seeing you at the KidUp Hub School Expo.</p>
    <p class="details">Friday, 6 November 2026 · 6:00 PM<br>City Play, Zahraa El-Maadi</p>
    <a class="back-button" href="/kidup-school-expo/">Back to event page</a>
  </main>
</body>
</html>
